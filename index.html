<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulaire de candidature</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --ink:#182522;
    --muted:#65726e;
    --paper:#f3eee5;
    --card:#fffdf8;
    --line:#d8d2c6;
    --accent:#e85d3f;
    --accent-dark:#bd3f2a;
    --accent-soft:#fce4dc;
    --green:#185c50;
    --error:#b33636;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 18px;
    color:var(--ink);
    background-color:var(--paper);
    background-image:linear-gradient(135deg, rgba(24,92,80,.08) 25%, transparent 25%), linear-gradient(315deg, rgba(232,93,63,.07) 25%, transparent 25%);
    background-position:0 0, 34px 34px;
    background-size:68px 68px;
    font-family:'DM Sans', sans-serif;
  }

  .card{
    width:100%;
    max-width:560px;
    padding:46px 48px 42px;
    background:var(--card);
    border:1px solid rgba(24,37,34,.12);
    border-radius:4px;
    box-shadow:12px 14px 0 rgba(24,92,80,.12), 0 24px 60px rgba(57,44,29,.14);
    animation:rise .55s ease both;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    margin:0 0 16px;
    padding:6px 10px;
    color:var(--card);
    background:var(--green);
    font-size:11px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  h1{
    max-width:430px;
    margin:0 0 36px;
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(30px, 5vw, 44px);
    line-height:1.02;
    letter-spacing:0;
  }

  label{
    display:block;
    margin-bottom:8px;
    color:var(--green);
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .field{ margin-bottom:22px; }

  input,
  select{
    width:100%;
    min-height:52px;
    padding:13px 15px;
    border:1px solid var(--line);
    border-radius:2px;
    background:#fff;
    color:var(--ink);
    font:500 15px 'DM Sans', sans-serif;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  input:hover,
  select:hover{ border-color:var(--green); }

  input:focus,
  select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:4px 4px 0 var(--accent-soft);
  }

  select:disabled,
  input:disabled{
    color:#9a9c94;
    background:#f1eee8;
    cursor:not-allowed;
  }

  .hint{
    min-height:16px;
    margin:7px 0 0;
    color:var(--muted);
    font-size:12px;
  }

  .hint.error{ color:var(--error); }

  button,
  .sheet-link{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:52px;
    border-radius:2px;
    font:700 14px 'DM Sans', sans-serif;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }

  button{
    margin-top:8px;
    padding:13px 16px;
    border:1px solid var(--accent);
    color:#fff;
    background:var(--accent);
  }

  button:not(:disabled):hover,
  .sheet-link:hover{ transform:translateY(-2px); }

  button:not(:disabled):hover{ background:var(--accent-dark); }
  button:not(:disabled):active,
  .sheet-link:active{ transform:translateY(0); }
  button:disabled{ opacity:.45; cursor:not-allowed; }

  .sheet-link{
    gap:9px;
    margin-top:12px;
    padding:12px 16px;
    border:1px solid var(--green);
    color:var(--green);
    background:transparent;
    text-decoration:none;
  }

  .sheet-link:hover{ background:#e8f0eb; }
  .sheet-icon{ font-size:18px; line-height:1; }

  .success{
    display:none;
    margin:20px 0 0;
    padding:14px 16px;
    border-left:4px solid var(--green);
    color:var(--green);
    background:#e5f0ea;
    font-size:14px;
  }

  .success.show{ display:block; }
  .success.error{ border-color:var(--error); color:var(--error); background:#f9e5e2; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:560px){
    body{ padding:24px 12px; }
    .card{ padding:32px 22px 28px; box-shadow:7px 9px 0 rgba(24,92,80,.12), 0 18px 38px rgba(57,44,29,.12); }
    h1{ margin-bottom:30px; font-size:32px; }
  }
</style>
</head>

<body>

<div class="card">

  <p class="eyebrow">Candidature</p>

  <h1>Formulaire de candidature en ligne</h1>

  <form id="candidatureForm" novalidate>

    <!-- NOM -->
    <div class="field">

      <label for="nom">Nom</label>

      <input
        type="text"
        id="nom"
        name="nom"
        required
        autocomplete="family-name"
      >

    </div>


    <!-- PRENOM -->
    <div class="field">

      <label for="prenom">Prénom</label>

      <input
        type="text"
        id="prenom"
        name="prenom"
        required
        autocomplete="given-name"
      >

    </div>


    <!-- PAYS -->
    <div class="field">

      <label for="pays">Pays</label>

      <select id="pays" required disabled>

        <option value="">
          Chargement des pays…
        </option>

      </select>

      <p class="hint" id="paysHint"></p>

    </div>


    <!-- UNIVERSITE -->
    <div class="field">

      <label for="universite">Université</label>

      <select id="universite" required disabled>

        <option value="">
          Choisissez d'abord un pays
        </option>

      </select>

      <p class="hint" id="uniHint"></p>

    </div>


    <!-- BOUTON -->
    <button
      type="submit"
      id="submitBtn"
      disabled
    >
      Envoyer ma candidature
    </button>

    <!-- ACCÈS DIRECT AU GOOGLE SHEET -->
    <!-- Remplace uniquement l'URL ci-dessous par l'URL de ton Google Sheet. -->
    <a
      class="sheet-link"
      id="sheetLink"
      href="https://docs.google.com/spreadsheets/d/1eiYcNDXlQ80U4btyFHmUflwYCIlHu-lf9FkD2BiVDKA/edit?gid=0#gid=0"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="sheet-icon">▦</span>
      Voir les candidatures dans Google Sheets
    </a>


    <!-- MESSAGE -->
    <p
      class="success"
      id="successMsg"
    >
      Candidature envoyée avec succès.
    </p>

  </form>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

// URL de ton Google Apps Script
const URL_GOOGLE_SHEET =
  'https://script.google.com/macros/s/AKfycbzOeSP70GlzukBazir4Q__y5gVumFqAor9ZsqNWY6gYmi6m_Dz8422s8yTPDx90d2xl/exec';

/*
   API des pays

   Cette API correspond au dépôt GitHub
   mledoze/countries
*/
const URL_API_PAYS =
  'https://raw.githubusercontent.com/mledoze/countries/master/dist/countries.json';


/*
   API principale des universités
*/
const URL_API_UNIVERSITES =
  'https://universities.hipolabs.com/search?country=';


/*
   Solution de secours :

   JSON distant GitHub contenant les universités.
*/
const URL_JSON_UNIVERSITES =
  'https://raw.githubusercontent.com/Hipo/university-domains-list/master/world_universities_and_domains.json';


/* =====================================================
   ELEMENTS HTML
===================================================== */

const paysSelect =
  document.getElementById('pays');

const uniSelect =
  document.getElementById('universite');

const paysHint =
  document.getElementById('paysHint');

const uniHint =
  document.getElementById('uniHint');

const submitBtn =
  document.getElementById('submitBtn');

const form =
  document.getElementById('candidatureForm');

const successMsg =
  document.getElementById('successMsg');


/* =====================================================
   VARIABLE POUR LE JSON UNIVERSITES
===================================================== */

let toutesLesUniversites = null;


/* =====================================================
   ETAPE 1
   CHARGER LES PAYS
===================================================== */

async function chargerPays(){

  try{

    paysHint.textContent = '';

    const response =
      await fetch(URL_API_PAYS);

    if(!response.ok){

      throw new Error(
        'Erreur API pays : ' + response.status
      );

    }

    const data =
      await response.json();


    /*
      Récupération des noms des pays
    */

    const noms =
      data

        .map(pays => pays.name.common)

        .sort((a,b) =>
          a.localeCompare(b)
        );


    /*
      Nettoyage du select
    */

    paysSelect.innerHTML =
      '<option value="">-- Sélectionnez un pays --</option>';


    /*
      Ajouter les pays
    */

    noms.forEach(nom => {

      const option =
        document.createElement('option');

      option.value = nom;

      option.textContent = nom;

      paysSelect.appendChild(option);

    });


    /*
      Activer le select
    */

    paysSelect.disabled = false;


  }catch(error){

    console.error(
      'Erreur chargement pays :',
      error
    );

    paysHint.textContent =
      'Impossible de charger la liste des pays.';

    paysHint.classList.add('error');

  }

}


/* =====================================================
   ETAPE 2
   API UNIVERSITES
===================================================== */

async function chargerUniversitesDepuisAPI(pays){

  const url =
    URL_API_UNIVERSITES +
    encodeURIComponent(pays);


  console.log(
    'Appel API universités :',
    url
  );


  const response =
    await fetch(url);


  if(!response.ok){

    throw new Error(
      'API universités indisponible : ' +
      response.status
    );

  }


  const data =
    await response.json();


  return data;

}


/* =====================================================
   ETAPE 3
   JSON GITHUB DE SECOURS
===================================================== */

async function chargerUniversitesDepuisGitHub(pays){

  /*
    Si le JSON n'a pas encore été chargé,
    on le télécharge.
  */

  if(!toutesLesUniversites){

    console.log(
      'Chargement du JSON GitHub...'
    );


    const response =
      await fetch(URL_JSON_UNIVERSITES);


    if(!response.ok){

      throw new Error(
        'Impossible de charger le JSON GitHub'
      );

    }


    toutesLesUniversites =
      await response.json();

  }


  /*
    Recherche des universités
    correspondant au pays.
  */

  const resultat =
    toutesLesUniversites.filter(
      universite =>

        universite.country &&

        universite.country.toLowerCase() ===
        pays.toLowerCase()
    );


  return resultat;

}


/* =====================================================
   ETAPE 4
   CHARGER LES UNIVERSITES
===================================================== */

async function chargerUniversites(pays){

  /*
    Désactiver temporairement
    le select
  */

  uniSelect.disabled = true;

  submitBtn.disabled = true;


  uniSelect.innerHTML =
    '<option value="">Chargement des universités…</option>';


  uniHint.textContent = '';

  uniHint.classList.remove('error');


  try{

    let data;


    /*
      ------------------------------------------------
      PREMIER ESSAI :
      API HIPO
      ------------------------------------------------
    */

    try{

      console.log(
        'Tentative avec l API Hipo...'
      );


      data =
        await chargerUniversitesDepuisAPI(pays);


      console.log(
        'Universités reçues depuis API Hipo :',
        data.length
      );


    }catch(apiError){

      /*
        ------------------------------------------------
        SI L'API HIPO NE FONCTIONNE PAS
        ON UTILISE GITHUB
        ------------------------------------------------
      */

      console.warn(
        'API Hipo indisponible.',
        apiError
      );


      console.log(
        'Utilisation du JSON GitHub...'
      );


      data =
        await chargerUniversitesDepuisGitHub(pays);

    }


    /*
      Vérifier les résultats
    */

    if(!data || data.length === 0){

      uniSelect.innerHTML =
        '<option value="">Aucune université trouvée</option>';

      uniHint.textContent =
        "Aucune université n'a été trouvée pour ce pays.";

      return;

    }


    /*
      Trier les universités
    */

    data.sort(
      (a,b) =>
        a.name.localeCompare(b.name)
    );


    /*
      Première option
    */

    uniSelect.innerHTML =
      '<option value="">-- Sélectionnez une université --</option>';


    /*
      Ajouter les universités
    */

    data.forEach(universite => {

      const option =
        document.createElement('option');

      option.value =
        universite.name;

      option.textContent =
        universite.name;

      uniSelect.appendChild(option);

    });


    /*
      Activer le select
    */

    uniSelect.disabled = false;


    uniHint.textContent =
      data.length +
      ' université(s) trouvée(s).';


  }catch(error){

    console.error(
      'Erreur finale universités :',
      error
    );


    uniSelect.innerHTML =
      '<option value="">Erreur de chargement</option>';


    uniHint.textContent =
      'Impossible de charger les universités. Vérifiez votre connexion.';


    uniHint.classList.add('error');

  }

}


/* =====================================================
   EVENEMENT : CHANGEMENT DE PAYS
===================================================== */

paysSelect.addEventListener(
  'change',
  () => {

    submitBtn.disabled = true;


    /*
      Aucun pays sélectionné
    */

    if(!paysSelect.value){

      uniSelect.innerHTML =
        '<option value="">Choisissez d\'abord un pays</option>';

      uniSelect.disabled = true;

      uniHint.textContent = '';

      return;

    }


    /*
      Charger les universités
    */

    chargerUniversites(
      paysSelect.value
    );

  }
);


/* =====================================================
   EVENEMENT : CHANGEMENT UNIVERSITE
===================================================== */

uniSelect.addEventListener(
  'change',
  () => {

    submitBtn.disabled =
      !uniSelect.value;

  }
);


/* =====================================================
   ENVOI DU FORMULAIRE
===================================================== */

form.addEventListener(
  'submit',
  async (e) => {

    e.preventDefault();


    /*
      Vérification
    */

    if(
      !document.getElementById('nom').value.trim() ||
      !document.getElementById('prenom').value.trim() ||
      !paysSelect.value ||
      !uniSelect.value
    ){

      return;

    }


    /*
      Récupération des données
    */

    const donnees = {

      nom:
        document
          .getElementById('nom')
          .value
          .trim(),

      prenom:
        document
          .getElementById('prenom')
          .value
          .trim(),

      pays:
        paysSelect.value,

      universite:
        uniSelect.value

    };


    /*
      Désactiver le bouton
    */

    submitBtn.disabled = true;

    submitBtn.textContent =
      'Envoi en cours…';


    try{

      /*
        Envoi vers Google Apps Script
      */

      await fetch(
        URL_GOOGLE_SHEET,
        {

          method:'POST',

          mode:'no-cors',

          headers:{
            'Content-Type':'text/plain'
          },

          body:
            JSON.stringify(donnees)

        }
      );


      /*
        Message de succès
      */

      successMsg.textContent =
        'Candidature envoyée avec succès.';

      successMsg.classList.remove(
        'error'
      );

      successMsg.classList.add(
        'show'
      );


      /*
        Réinitialiser le formulaire
      */

      form.reset();


      uniSelect.innerHTML =
        '<option value="">Choisissez d\'abord un pays</option>';

      uniSelect.disabled = true;

      submitBtn.disabled = true;


    }catch(error){

      console.error(
        'Erreur envoi formulaire :',
        error
      );


      successMsg.textContent =
        "Erreur lors de l'envoi. Vérifiez votre connexion et réessayez.";


      successMsg.classList.add(
        'error',
        'show'
      );

    }finally{

      submitBtn.textContent =
        'Envoyer ma candidature';

    }

  }
);


/* =====================================================
   DEMARRAGE
===================================================== */

chargerPays();

</script>

</body>
</html>
